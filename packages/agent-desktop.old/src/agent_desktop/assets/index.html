<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Desktops</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <strong>Agent Desktops</strong>
    <select id="sessions" aria-label="Agent desktop"></select>
    <span id="state" data-state="idle">Loading</span>
    <button id="refresh" type="button">Refresh</button>
    <button id="fullscreen" type="button">Fullscreen</button>
    <button id="destroy" type="button">Destroy</button>
  </header>
  <main>
    <div id="empty">
      <h1>No desktop selected</h1>
      <p>Create one with <code>agent-desktop create AGENT_ID --view</code>.</p>
    </div>
    <div id="screen" aria-label="Remote agent desktop"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
